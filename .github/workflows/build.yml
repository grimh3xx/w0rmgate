name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: w0rmgate-linux-x64
          path: target/release/w0rmgate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Reverse SOCKS tunnel e2e
        run: ./tests/e2e.sh
      - name: Soak (60 concurrent)
        run: ./tests/soak.sh
      - name: UDP associate
        run: ./tests/udp.sh
